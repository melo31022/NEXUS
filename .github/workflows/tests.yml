name: NEXUS 1.1 validation

on:
  push:
    branches: [dev-1.1, nexus-1.1-work]
  pull_request:
    branches: [main, dev-1.1]

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Show runner architecture
        run: python -c "import platform; print(platform.platform()); print(platform.machine())"
      - name: Install test dependency
        if: runner.os != 'Windows'
        run: python -m pip install "requests>=2.31,<3"
      - name: Install Windows desktop dependencies
        if: runner.os == 'Windows'
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python files
        run: python -m compileall -q .
